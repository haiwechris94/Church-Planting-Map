$kind: http-request
description: "Create a village with minimal required fields. Status defaults to
  'unreached' if not provided. Valid status values: unreached, in-progress,
  church-planted, multiplying"
url: "{{baseUrl}}/api/villages"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "My Test Village",
      "location": {
        "type": "Point",
        "coordinates": [28.0473, -26.2041]
      },
      "population": 5000,
      "region": "Gauteng",
      "country": "South Africa"
    }
order: 4000
