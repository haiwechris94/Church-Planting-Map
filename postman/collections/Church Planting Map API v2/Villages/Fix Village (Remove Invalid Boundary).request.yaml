$kind: http-request
description: Use this to fix villages with invalid boundary data. Setting
  boundary to null will remove the invalid boundary field from the document.
url: "{{baseUrl}}/api/villages/:id"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
pathVariables:
  id: ""
body:
  type: text
  content: |-
    {
      "boundary": null
    }
order: 7000
