$kind: http-request
url: "{{baseUrl}}/api/auth/profile"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Updated Name",
      "phone": "+1987654321",
      "notificationPreferences": {
        "email": true,
        "push": true,
        "proximity": true,
        "proximityRadius": 15000
      }
    }
order: 4000
