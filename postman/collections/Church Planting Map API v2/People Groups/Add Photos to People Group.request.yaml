$kind: http-request
url: "{{baseUrl}}/api/people-groups/:id/photos"
method: POST
headers:
  Authorization: Bearer {{token}}
pathVariables:
  id: ""
body:
  type: formdata
  content:
    - type: file
      key: photos
      src: ""
    - type: text
      key: caption
      value: Community gathering
order: 9000
