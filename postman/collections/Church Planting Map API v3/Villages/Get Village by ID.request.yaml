$kind: http-request
name: Get Village by ID
method: GET
url: '{{baseUrl}}/api/villages/{{villageId}}'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
    disabled: true
pathVariables:
  - key: villageId
    value: '{{villageId}}'
    description: MongoDB ObjectId of the village
