$kind: http-request
name: Fix Village Boundary
method: PATCH
url: '{{baseUrl}}/api/villages/{{villageId}}/fix-boundary'
order: 8000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "removeBoundary": true
    }
