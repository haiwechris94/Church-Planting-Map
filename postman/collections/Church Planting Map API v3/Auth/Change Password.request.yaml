$kind: http-request
name: 'Change Password'
method: PUT
url: '{{baseUrl}}/api/auth/change-password'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "password123",
      "newPassword": "newpassword456"
    }
