$kind: http-request
name: 'Update Profile'
method: PUT
url: '{{baseUrl}}/api/auth/profile'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "John Doe Updated",
      "email": "john@example.com",
      "bio": "Church planting missionary"
    }
