$kind: http-request
method: POST
url: '{{baseUrl}}/api/voronoi/generate'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "country": "{{countryCode}}",
      "level": 1,
      "forceRegenerate": false
    }
