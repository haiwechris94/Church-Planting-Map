$kind: http-request
method: POST
url: '{{baseUrl}}/api/import/detect-polygons'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: formdata
  content:
    - key: file
      type: file
      src: people_groups_import_template.csv
      description: CSV file with village names for polygon detection
    - key: country
      type: text
      value: '{{countryCode}}'
