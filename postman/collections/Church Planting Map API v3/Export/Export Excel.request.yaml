$kind: http-request
method: GET
url: '{{baseUrl}}/api/export/excel'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
queryParams:
  - key: country
    value: '{{countryCode}}'
    disabled: true
  - key: status
    value: active
    disabled: true
  - key: region
    value: ''
    disabled: true
