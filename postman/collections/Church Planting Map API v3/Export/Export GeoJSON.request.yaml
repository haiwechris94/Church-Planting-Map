$kind: http-request
method: GET
url: '{{baseUrl}}/api/export/geojson'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
queryParams:
  - key: country
    value: '{{countryCode}}'
    disabled: true
  - key: status
    value: active
    disabled: true
  - key: region
    value: ''
    disabled: true
  - key: includeVillages
    value: 'true'
    disabled: true
  - key: includePeopleGroups
    value: 'true'
    disabled: true
