$kind: http-request
method: POST
url: '{{baseUrl}}/api/export/share'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "country": "{{countryCode}}",
      "status": "active",
      "format": "geojson",
      "expiresIn": 7
    }
