$kind: http-request
method: GET
url: '{{baseUrl}}/api/export/people-groups/csv'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
queryParams:
  - key: country
    value: '{{countryCode}}'
    disabled: true
  - key: status
    value: active
    disabled: true
  - key: region
    value: ''
    disabled: true
