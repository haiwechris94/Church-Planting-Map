$kind: http-request
method: POST
url: '{{baseUrl}}/api/organizations/{{organizationId}}/invite'
order: 11000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
pathVariables:
  - key: organizationId
    value: '{{organizationId}}'
body:
  type: json
  content: |-
    {
      "emails": ["user@example.com"],
      "role": "member",
      "message": "You are invited to join our organization."
    }
