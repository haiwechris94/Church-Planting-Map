$kind: http-request
method: PUT
url: '{{baseUrl}}/api/organizations/{{organizationId}}'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
pathVariables:
  - key: organizationId
    value: '{{organizationId}}'
body:
  type: json
  content: |-
    {
      "name": "Updated Organization Name",
      "description": "Updated description",
      "website": "https://updated.org"
    }
