$kind: http-request
method: POST
url: '{{baseUrl}}/api/organizations/{{organizationId}}/members'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
pathVariables:
  - key: organizationId
    value: '{{organizationId}}'
body:
  type: json
  content: |-
    {
      "userId": "{{userId}}",
      "role": "member"
    }
